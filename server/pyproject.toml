[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aioffice"
version = "0.1.0"
description = "AI Office: broker-report markdown library and in-house LLM client"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1.0",
  "pyyaml>=6.0,<7.0",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
analyst = ["mcp>=1.2,<2.0"]
slides = ["python-pptx>=1.0,<2.0"]

[tool.setuptools.packages.find]
include = ["aioffice*"]

[tool.setuptools.package-data]
aioffice = [
  "schema.sql", "slides/static/*.html", "slides/samples/*.json",
  "analyst/static/*.html", "analyst/samples/reports/*.md",
  "dataplat/schema.sql", "dataplat/static/*.html",
  "dataplat/samples/*.yaml", "dataplat/samples/*.sql", "dataplat/clients/*.ts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
